apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "platform-api.fullname" . }}
  labels:
    app: {{ include "platform-api.name" . }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "platform-api.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "platform-api.name" . }}

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - backend

      tolerations:
        - key: workload
          operator: Equal
          value: backend
          effect: NoSchedule

      containers:
        - name: platform-api

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            {{- toYaml .Values.resources | nindent 12 }}