apiVersion: v1
kind: Service

metadata:
  name: {{ include "platform-api.fullname" . }}
  labels:
    app: {{ include "platform-api.name" . }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "platform-api.name" . }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP